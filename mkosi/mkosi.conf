# immutable-ubuntu factory configuration.
#
# Produces the versioned system tree:
#   mkosi --format=tar  ->  ubuntu_<version>.root.tar.zst
#
# The UKI is assembled separately by publish/build-uki.sh (ukify), NOT by
# mkosi: mkosi's UKI assembly silently skips on UnifiedKernelImages=auto,
# and its default initrd (mkosi-initrd) does not run our initramfs-tools
# hook. build-uki.sh extracts the tarball, builds the initrd with the
# image's own initramfs-tools in a chroot (hook verified present), then
# ukify-assembles ubuntu_<version>.efi.
#
# The tarball is unpacked by systemd-sysupdate into
# /var/lib/immutable/versions/<version>/. The UKI carries
# immutable.version=<version> on its kernel command line; its initrd
# bind-mounts <version>/usr over /usr before switch-root (hook in
# mkosi.skeleton/etc/initramfs-tools/).
#
# Version is injected at publish time: publish.sh writes
# mkosi.conf.d/99-version.conf with ImageVersion=<version> and the
# matching KernelCommandLine=.

[Distribution]
Distribution=ubuntu
Release=noble
# podman, buildah, skopeo and distrobox live in universe, which mkosi
# does not enable by default (apt then fails with exit 100).
Repositories=universe

[Output]
Format=tar
Output=immutable-ubuntu
# Pin these: newer mkosi defaults to the cwd instead of mkosi.output/,
# and to zstd instead of xz. The publish scripts and the sysupdate
# MatchPattern below all assume mkosi.output/ + .tar.zst.
OutputDirectory=mkosi.output
CompressOutput=zstd

[Content]
Packages=
        systemd
        systemd-sysv
        udev
        dbus
        util-linux
        mount
        kmod
        iproute2
        iputils-ping
        ca-certificates
        sudo
        less
        nano
        openssh-server
        linux-image-generic
        initramfs-tools
        podman
        buildah
        skopeo
        flatpak
        distrobox
        ufw
        apparmor-utils

# The immutable base has no use for snapd: user applications come from
# flatpak / distrobox / podman. snapd stays available inside distroboxes.
RemovePackages=
        snapd

# Ships the initramfs-tools hook that mounts the versioned /usr
# (see mkosi.skeleton/etc/initramfs-tools/).
SkeletonTrees=mkosi.skeleton
