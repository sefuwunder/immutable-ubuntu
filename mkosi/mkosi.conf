# immutable-ubuntu factory configuration.
#
# Produces two artifacts (publish.sh invokes mkosi twice):
#   --format=tar  ->  ubuntu_<version>.root.tar.xz   versioned system tree
#   --format=uki  ->  ubuntu_<version>.efi            unified kernel image
#
# The tarball is unpacked by systemd-sysupdate into
# /var/lib/immutable/versions/<version>/. The UKI carries
# immutable.version=<version> on its kernel command line; its initrd
# bind-mounts <version>/usr over /usr before switch-root (hook in
# mkosi.skeleton/etc/initramfs-tools/).
#
# Version is injected at publish time: publish.sh writes
# mkosi.conf.d/99-version.conf with ImageVersion=<version> and the
# matching KernelCommandLine=.

[Distribution]
Distribution=ubuntu
Release=noble
# podman, buildah, skopeo and distrobox live in universe, which mkosi
# does not enable by default (apt then fails with exit 100).
Repositories=universe

[Output]
Format=tar
Output=immutable-ubuntu

[Content]
Packages=
        systemd
        systemd-sysv
        udev
        dbus
        util-linux
        mount
        kmod
        iproute2
        iputils-ping
        ca-certificates
        sudo
        less
        nano
        openssh-server
        linux-image-generic
        initramfs-tools
        podman
        buildah
        skopeo
        flatpak
        distrobox
        ufw
        apparmor-utils

# The immutable base has no use for snapd: user applications come from
# flatpak / distrobox / podman. snapd stays available inside distroboxes.
RemovePackages=
        snapd

# Ships the initramfs-tools hook that mounts the versioned /usr
# (see mkosi.skeleton/etc/initramfs-tools/).
SkeletonTrees=mkosi.skeleton
